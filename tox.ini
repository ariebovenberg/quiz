[tox]
isolated_build = true
envlist = py{39,310,311,312,313},lint,isort
[testenv]
allowlist_externals =
  poetry
setenv=
    POETRY_VIRTUALENVS_CREATE=false
commands_pre=
    poetry install -n -v --no-root
commands=
  poetry run pytest {posargs}

[testenv:py310]
commands =
    poetry run pytest --live --cov=quiz {posargs}

[testenv:lint]
commands=
  poetry run black --check --diff src/ tests/
  poetry run flake8 src/ tests/

[testenv:isort]
commands=
  poetry run isort --check-only --diff src/ tests/

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312, lint, isort
    3.13: py313
